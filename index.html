
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seerah API Integration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #183b32;
    }

    header {
      background: #145744;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #18745a;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #104b3b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin: 15px 0;
      color: #555;
    }

    #container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      border: 1px solid #dce7e1;
      box-shadow: 0 3px 12px #0000000a;
    }

    .card h3 {
      color: #145744;
      margin-top: 0;
    }

    .urdu {
      direction: rtl;
      text-align: right;
      font-size: 19px;
      line-height: 2;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>Seerah API Integration</h1>
    <p>Explore Islamic knowledge through Seerah APIs</p>
  </header>

  <main>
    <h2>Seerah Collection</h2>

    <div class="controls">
      <button onclick="loadData('shamail')">Shamail</button>
      <button onclick="loadData('courses')">Courses</button>
      <button onclick="loadData('timeline')">Timeline</button>
    </div>

    <p id="status">Loading data...</p>
    <div id="container"></div>
  </main>

  <footer>
    <p>Seerah API Integration Project | JavaScript Fetch API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
